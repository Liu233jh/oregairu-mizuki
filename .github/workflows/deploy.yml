name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          # Copy custom text files over original
          cp -r ../custom/src/* src/ 2>/dev/null || true
          cp -f ../custom/package.json package.json 2>/dev/null || true
          cp -f ../custom/astro.config.mjs astro.config.mjs 2>/dev/null || true
          cp -f ../custom/tsconfig.json tsconfig.json 2>/dev/null || true
          cp -f ../custom/svelte.config.js svelte.config.js 2>/dev/null || true
          cp -f ../custom/postcss.config.mjs postcss.config.mjs 2>/dev/null || true
          cp -f ../custom/pnpm-workspace.yaml pnpm-workspace.yaml 2>/dev/null || true
          cp -f ../custom/.npmrc .npmrc 2>/dev/null || true
          cp -f ../custom/biome.json biome.json 2>/dev/null || true
          echo "=== Files in site ==="
          ls -la
          echo "=== pnpm-lock.yaml exists? ==="
          ls -la pnpm-lock.yaml 2>/dev/null || echo "NOT FOUND"

      - name: Download Oregairu custom images
        run: |
          cd site
          TUNNEL="https://23b107423169f5.lhr.life"
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          for i in 1 2 3 4; do
            curl -sL -o "public/assets/desktop-banner/$i.webp" "$TUNNEL/oregairu-images/desktop-banner/$i.webp"
            curl -sL -o "public/assets/mobile-banner/$i.webp" "$TUNNEL/oregairu-images/mobile-banner/$i.webp"
          done
          for f in oregairu_s1 oregairu_s2 oregairu_s3 oregairu_ova; do
            curl -sL -o "public/assets/anime/$f.webp" "$TUNNEL/oregairu-images/anime/$f.webp"
          done
          echo "=== Downloaded images ==="
          find public/assets -name "*.webp" -exec ls -la {} \;

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd site
          echo "=== pnpm version ==="
          pnpm --version
          echo "=== Running pnpm install ==="
          pnpm install --no-frozen-lockfile 2>&1 | tail -50
          echo "=== Install exit code: $? ==="

      - name: Build
        run: |
          cd site
          echo "=== Running build ==="
          pnpm build 2>&1 | tail -80
          echo "=== Build exit code: $? ==="
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
