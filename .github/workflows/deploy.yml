name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          cp -r ../custom/src/* src/ 2>/dev/null || true
          cp -f ../custom/package.json package.json 2>/dev/null || true
          cp -f ../custom/astro.config.mjs astro.config.mjs 2>/dev/null || true
          cp -f ../custom/tsconfig.json tsconfig.json 2>/dev/null || true
          cp -f ../custom/svelte.config.js svelte.config.js 2>/dev/null || true
          cp -f ../custom/postcss.config.mjs postcss.config.mjs 2>/dev/null || true
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc package-lock.json

      - name: Download Oregairu custom images
        run: |
          cd site
          TUNNEL="https://6195c4e14b3eab.lhr.life"
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          for i in 1 2 3 4; do
            curl -sL --retry 5 --retry-delay 3 -o "public/assets/desktop-banner/$i.webp" "$TUNNEL/oregairu-images/desktop-banner/$i.webp"
            curl -sL --retry 5 --retry-delay 3 -o "public/assets/mobile-banner/$i.webp" "$TUNNEL/oregairu-images/mobile-banner/$i.webp"
          done
          for f in oregairu_s1 oregairu_s2 oregairu_s3 oregairu_ova; do
            curl -sL --retry 5 --retry-delay 3 -o "public/assets/anime/$f.webp" "$TUNNEL/oregairu-images/anime/$f.webp"
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd site
          npm config set registry https://registry.npmmirror.com
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -20

      - name: Build
        run: |
          cd site
          echo "=== PWD before build ==="
          pwd
          echo "=== Running astro build ==="
          npx astro build
          BUILD_EXIT=$?
          echo "=== Build exit code: $BUILD_EXIT ==="
          echo "=== PWD after build ==="
          pwd
          echo "=== site/dist contents ==="
          ls -la dist/ 2>&1 | head -20
          echo "=== dist file count ==="
          find dist -type f 2>/dev/null | wc -l
          echo "=== Go back to root ==="
          cd ..
          pwd
          echo "=== Root site/dist check ==="
          ls -la site/dist/ 2>&1 | head -10
          exit $BUILD_EXIT
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
