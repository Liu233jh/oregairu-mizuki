name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          set -x
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          echo "=== Original repo files ==="
          ls -la
          echo "=== pnpm-workspace.yaml ==="
          cat pnpm-workspace.yaml 2>/dev/null || echo "NOT FOUND"
          echo "=== .npmrc ==="
          cat .npmrc 2>/dev/null || echo "NOT FOUND"
          echo "=== package.json scripts ==="
          cat package.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('scripts',{}), indent=2)); print('packageManager:', d.get('packageManager','N/A'))"
          
          # Apply custom text files
          cp -r ../custom/src/* src/ 2>/dev/null || true
          cp -f ../custom/package.json package.json 2>/dev/null || true
          cp -f ../custom/astro.config.mjs astro.config.mjs 2>/dev/null || true
          cp -f ../custom/tsconfig.json tsconfig.json 2>/dev/null || true
          cp -f ../custom/svelte.config.js svelte.config.js 2>/dev/null || true
          cp -f ../custom/postcss.config.mjs postcss.config.mjs 2>/dev/null || true
          
          # Remove problematic fields and lock file
          sed -i '/"packageManager"/d' package.json
          rm -f pnpm-lock.yaml
          
          echo "=== Modified package.json scripts ==="
          cat package.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('scripts',{}), indent=2))"

      - name: Download Oregairu custom images
        run: |
          cd site
          TUNNEL="https://b809cb2bfc7edd.lhr.life"
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          for i in 1 2 3 4; do
            curl -sL --retry 3 --retry-delay 2 -o "public/assets/desktop-banner/$i.webp" "$TUNNEL/oregairu-images/desktop-banner/$i.webp"
            curl -sL --retry 3 --retry-delay 2 -o "public/assets/mobile-banner/$i.webp" "$TUNNEL/oregairu-images/mobile-banner/$i.webp"
          done
          for f in oregairu_s1 oregairu_s2 oregairu_s3 oregairu_ova; do
            curl -sL --retry 3 --retry-delay 2 -o "public/assets/anime/$f.webp" "$TUNNEL/oregairu-images/anime/$f.webp"
          done
          echo "=== Downloaded images ==="
          find public/assets -name "*.webp" -exec ls -la {} \;

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: |
          cd site
          echo "=== Node version ==="
          node --version
          echo "=== pnpm version ==="
          pnpm --version
          echo "=== Current dir ==="
          pwd
          ls -la
          echo "=== Running pnpm install ==="
          pnpm config set strict-peer-dependencies false
          pnpm install --no-frozen-lockfile 2>&1
          echo "=== pnpm install exit code: $? ==="
          echo "=== node_modules exists? ==="
          ls -la node_modules 2>/dev/null | head -5 || echo "node_modules NOT FOUND"

      - name: Build
        run: |
          cd site
          echo "=== Running build ==="
          pnpm build 2>&1
          echo "=== Build exit code: $? ==="
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
