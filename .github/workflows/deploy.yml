name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          # Copy custom files over original
          cp -r ../custom/src/* src/ 2>/dev/null || true
          cp -r ../custom/public/* public/ 2>/dev/null || true
          cp -f ../custom/package.json package.json 2>/dev/null || true
          cp -f ../custom/astro.config.mjs astro.config.mjs 2>/dev/null || true
          cp -f ../custom/tsconfig.json tsconfig.json 2>/dev/null || true
          cp -f ../custom/svelte.config.js svelte.config.js 2>/dev/null || true
          cp -f ../custom/postcss.config.mjs postcss.config.mjs 2>/dev/null || true
          cp -f ../custom/pnpm-workspace.yaml pnpm-workspace.yaml 2>/dev/null || true
          cp -f ../custom/.npmrc .npmrc 2>/dev/null || true
          cp -f ../custom/biome.json biome.json 2>/dev/null || true
          ls -la

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: cd site && pnpm install --no-frozen-lockfile

      - name: Build
        run: cd site && pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
