name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          # Apply custom source files
          cp -r ../custom/src/* src/ 2>/dev/null || true
          # Apply custom config files
          for f in package.json astro.config.mjs tsconfig.json svelte.config.js postcss.config.mjs; do
            [ -f "../custom/$f" ] && cp -f "../custom/$f" "$f"
          done
          # Remove pnpm-specific files
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc
          echo "=== Site ready ==="

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd site
          npm config set registry https://registry.npmjs.org/
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: |
          cd site
          npx astro build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
