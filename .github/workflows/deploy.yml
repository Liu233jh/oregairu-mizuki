name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          cp -r ../custom/src/* src/ 2>/dev/null || true
          cp -f ../custom/package.json package.json 2>/dev/null || true
          cp -f ../custom/astro.config.mjs astro.config.mjs 2>/dev/null || true
          cp -f ../custom/tsconfig.json tsconfig.json 2>/dev/null || true
          cp -f ../custom/svelte.config.js svelte.config.js 2>/dev/null || true
          cp -f ../custom/postcss.config.mjs postcss.config.mjs 2>/dev/null || true
          # Copy custom images directly from repo
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          cp -f ../custom/public/assets/desktop-banner/*.webp public/assets/desktop-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/mobile-banner/*.webp public/assets/mobile-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/anime/*.webp public/assets/anime/ 2>/dev/null || true
          echo "=== Verify images ==="
          find public/assets -name "*.webp" -size +1k | wc -l
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc package-lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (with retry)
        run: |
          cd site
          npm config set registry https://registry.npmmirror.com
          for attempt in 1 2 3; do
            echo "=== npm install attempt $attempt ==="
            npm install --legacy-peer-deps --no-audit --no-fund && break
            echo "Attempt $attempt failed, retrying..."
            rm -rf node_modules
            sleep 5
          done
          echo "=== Verify astro ==="
          ls node_modules/.bin/astro && echo "astro found"

      - name: Build (with retry)
        run: |
          cd site
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            npx astro build && break
            echo "Build attempt $attempt failed, retrying..."
            rm -rf dist .astro
            sleep 5
          done
          echo "=== Verify dist ==="
          ls -la dist/ | head -10
          find dist -type f | wc -l
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
