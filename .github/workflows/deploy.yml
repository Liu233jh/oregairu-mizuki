name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          cp -r ../custom/src/* src/ 2>/dev/null || true
          for f in package.json astro.config.mjs tsconfig.json svelte.config.js postcss.config.mjs; do
            [ -f "../custom/$f" ] && cp -f "../custom/$f" "$f"
          done
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          cp -f ../custom/public/assets/desktop-banner/*.webp public/assets/desktop-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/mobile-banner/*.webp public/assets/mobile-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/anime/*.webp public/assets/anime/ 2>/dev/null || true
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc

      - name: Re-encode WebP images
        run: |
          cd site
          pip install Pillow -q 2>&1 | tail -2
          python3 << 'EOF'
          from PIL import Image
          import os
          count = 0
          for root, dirs, files in os.walk('public/assets'):
              for f in files:
                  if f.endswith('.webp'):
                      path = os.path.join(root, f)
                      try:
                          img = Image.open(path)
                          img = img.convert('RGB')
                          img.save(path, 'WEBP', quality=80, method=6)
                          count += 1
                      except Exception as e:
                          print(f'ERROR {path}: {e}')
          print(f'Re-encoded {count} WebP images')
          EOF

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build with full logging
        run: |
          cd site
          npm config set registry https://registry.npmjs.org/
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5
          echo "=== npm install done ==="
          
          npx astro build > /tmp/build-full.log 2>&1
          BUILD_EXIT=$?
          echo "Build exit: $BUILD_EXIT"
          
          # Save full log to custom dir for upload
          cp /tmp/build-full.log ../custom/build-full.log
          echo "BUILD_EXIT=$BUILD_EXIT" >> ../custom/build-full.log
          echo "dist files: $(find dist -type f 2>/dev/null | wc -l)" >> ../custom/build-full.log
          
          cd ../custom
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-full.log
          git commit -m "Full build log (exit=$BUILD_EXIT)" || true
          git push || true
          exit $BUILD_EXIT
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to gh-pages branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
