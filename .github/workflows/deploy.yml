name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: 1
      SHARP_FORCE_GLIBC: 1
      npm_config_legacy_peer_deps: true
      npm_config_audit: false
      npm_config_fund: false
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          set -e
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          cp -r ../custom/src/* src/ 2>/dev/null || true
          for f in package.json astro.config.mjs tsconfig.json svelte.config.js postcss.config.mjs; do
            [ -f "../custom/$f" ] && cp -f "../custom/$f" "$f"
          done
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          cp -f ../custom/public/assets/desktop-banner/*.webp public/assets/desktop-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/mobile-banner/*.webp public/assets/mobile-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/anime/*.webp public/assets/anime/ 2>/dev/null || true
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc
          echo "=== Custom images: $(find public/assets -name '*.webp' | wc -l) ==="

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd site
          # Use official npm registry with extended timeouts
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 10
          npm config set fetch-retry-mintimeout 30000
          npm config set fetch-retry-maxtimeout 180000
          npm config set fetch-timeout 600000
          for attempt in 1 2 3 4 5; do
            echo "=== npm install attempt $attempt at $(date) ==="
            if npm install 2>&1 | tail -50; then
              echo "SUCCESS: npm install completed on attempt $attempt"
              break
            fi
            echo "FAILED: attempt $attempt, exit code $?"
            rm -rf node_modules package-lock.json ~/.npm/_cacache
            sleep 15
          done
          echo "=== astro binary: $(ls node_modules/.bin/astro 2>/dev/null && echo found || echo MISSING) ==="
          echo "=== node_modules: $(du -sh node_modules 2>/dev/null | cut -f1) ==="

      - name: Build
        run: |
          cd site
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            if npx astro build 2>&1 | tail -80; then
              echo "SUCCESS: Build completed on attempt $attempt"
              break
            fi
            echo "FAILED: Build attempt $attempt"
            rm -rf dist .astro
            sleep 5
          done
          echo "=== dist files: $(find dist -type f | wc -l) ==="
          ls -la dist/ | head -15
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to gh-pages branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
