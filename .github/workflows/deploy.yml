name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          # Apply custom source files
          cp -r ../custom/src/* src/ 2>/dev/null || true
          # Apply custom config files
          for f in package.json astro.config.mjs tsconfig.json svelte.config.js postcss.config.mjs; do
            [ -f "../custom/$f" ] && cp -f "../custom/$f" "$f"
          done
          # Remove pnpm-specific files
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc
          echo "=== Site ready ==="

      - name: Download oregairu images
        run: |
          cd site
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          # Desktop banners
          curl -sL "https://aka.doubaocdn.com/s/SAF9DaYCbR" -o public/assets/desktop-banner/1.webp
          curl -sL "https://aka.doubaocdn.com/s/2VUeuUMUYp" -o public/assets/desktop-banner/2.webp
          curl -sL "https://aka.doubaocdn.com/s/lf4tVVbttZ" -o public/assets/desktop-banner/3.webp
          curl -sL "https://aka.doubaocdn.com/s/rg9vLOVsyL" -o public/assets/desktop-banner/4.webp
          # Mobile banners
          curl -sL "https://aka.doubaocdn.com/s/R0vPjfkUxp" -o public/assets/mobile-banner/1.webp
          curl -sL "https://aka.doubaocdn.com/s/VbfV2Pv7kA" -o public/assets/mobile-banner/2.webp
          curl -sL "https://aka.doubaocdn.com/s/ADmReYEdpQ" -o public/assets/mobile-banner/3.webp
          curl -sL "https://aka.doubaocdn.com/s/c1TXb6OOj5" -o public/assets/mobile-banner/4.webp
          # Anime covers
          curl -sL "https://aka.doubaocdn.com/s/VHBwonIAwI" -o public/assets/anime/oregairu_s1.webp
          curl -sL "https://aka.doubaocdn.com/s/pUueDpiIIL" -o public/assets/anime/oregairu_s2.webp
          curl -sL "https://aka.doubaocdn.com/s/fcZIF8zxwg" -o public/assets/anime/oregairu_s3.webp
          curl -sL "https://aka.doubaocdn.com/s/oawMiPyMax" -o public/assets/anime/oregairu_ova.webp
          # Verify images
          file public/assets/desktop-banner/*.webp public/assets/mobile-banner/*.webp public/assets/anime/*.webp
          ls -la public/assets/desktop-banner/ public/assets/mobile-banner/ public/assets/anime/

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd site
          npm config set registry https://registry.npmjs.org/
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: |
          cd site
          npx astro build
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
