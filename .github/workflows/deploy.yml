name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          # Copy custom text files over original
          cp -r ../custom/src/* src/ 2>/dev/null || true
          cp -f ../custom/package.json package.json 2>/dev/null || true
          cp -f ../custom/astro.config.mjs astro.config.mjs 2>/dev/null || true
          cp -f ../custom/tsconfig.json tsconfig.json 2>/dev/null || true
          cp -f ../custom/svelte.config.js svelte.config.js 2>/dev/null || true
          cp -f ../custom/postcss.config.mjs postcss.config.mjs 2>/dev/null || true
          cp -f ../custom/pnpm-workspace.yaml pnpm-workspace.yaml 2>/dev/null || true
          cp -f ../custom/.npmrc .npmrc 2>/dev/null || true
          cp -f ../custom/biome.json biome.json 2>/dev/null || true

      - name: Download Oregairu custom images
        run: |
          cd site
          TUNNEL="https://23b107423169f5.lhr.life"
          # Download desktop banners
          mkdir -p public/assets/desktop-banner
          for i in 1 2 3 4; do
            curl -sL -o "public/assets/desktop-banner/$i.webp" "$TUNNEL/oregairu-images/desktop-banner/$i.webp" && echo "OK: desktop-banner/$i.webp ($(wc -c < public/assets/desktop-banner/$i.webp) bytes)"
          done
          # Download mobile banners
          mkdir -p public/assets/mobile-banner
          for i in 1 2 3 4; do
            curl -sL -o "public/assets/mobile-banner/$i.webp" "$TUNNEL/oregairu-images/mobile-banner/$i.webp" && echo "OK: mobile-banner/$i.webp ($(wc -c < public/assets/mobile-banner/$i.webp) bytes)"
          done
          # Download anime covers
          mkdir -p public/assets/anime
          for f in oregairu_s1 oregairu_s2 oregairu_s3 oregairu_ova; do
            curl -sL -o "public/assets/anime/$f.webp" "$TUNNEL/oregairu-images/anime/$f.webp" && echo "OK: anime/$f.webp ($(wc -c < public/assets/anime/$f.webp) bytes)"
          done
          echo "All images downloaded successfully"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: cd site && pnpm install --no-frozen-lockfile

      - name: Build
        run: cd site && pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
