name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          cp -r ../custom/src/* src/ 2>/dev/null || true
          for f in package.json astro.config.mjs tsconfig.json svelte.config.js postcss.config.mjs; do
            [ -f "../custom/$f" ] && cp -f "../custom/$f" "$f"
          done
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          cp -f ../custom/public/assets/desktop-banner/*.webp public/assets/desktop-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/mobile-banner/*.webp public/assets/mobile-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/anime/*.webp public/assets/anime/ 2>/dev/null || true
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc
          echo "=== Custom images: $(find public/assets -name '*.webp' | wc -l) ==="

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Diagnose environment
        run: |
          echo "=== Node version ==="
          node --version
          echo "=== npm version ==="
          npm --version
          echo "=== OS info ==="
          uname -a
          echo "=== npm config ==="
          npm config list
          echo "=== package.json exists ==="
          ls -la site/package.json
          echo "=== package.json first 5 lines ==="
          head -5 site/package.json
          echo "=== Test npm registry connectivity ==="
          curl -sI https://registry.npmjs.org/ | head -5
          echo "=== Disk space ==="
          df -h /tmp

      - name: Install dependencies (verbose)
        run: |
          cd site
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 5
          echo "=== Starting npm install at $(date) ==="
          npm install --legacy-peer-deps --no-audit --no-fund --loglevel=verbose 2>&1 | tail -100
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== npm install exit code: $EXIT_CODE at $(date) ==="
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== npm install FAILED, checking partial install ==="
            ls node_modules 2>/dev/null | head -20 || echo "no node_modules"
            du -sh node_modules 2>/dev/null || echo "no node_modules"
          fi
          exit $EXIT_CODE

      - name: Build
        if: success()
        run: |
          cd site
          echo "=== Starting build at $(date) ==="
          npx astro build 2>&1 | tail -80
          echo "=== Build exit code: $? at $(date) ==="
          echo "=== dist files: $(find dist -type f | wc -l) ==="
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to gh-pages branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
