name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (custom files)
        uses: actions/checkout@v4
        with:
          path: custom

      - name: Clone original Mizuki repo and apply custom files
        run: |
          git clone --depth 1 https://github.com/LyraVoid/Mizuki.git site
          cd site
          cp -r ../custom/src/* src/ 2>/dev/null || true
          for f in package.json astro.config.mjs tsconfig.json svelte.config.js postcss.config.mjs; do
            [ -f "../custom/$f" ] && cp -f "../custom/$f" "$f"
          done
          mkdir -p public/assets/desktop-banner public/assets/mobile-banner public/assets/anime
          cp -f ../custom/public/assets/desktop-banner/*.webp public/assets/desktop-banner/ 2>/dev/null || true
          cp -f ../custom/public/assets/mobile-banner/*.webp public/assets/mobile-banner/ 2>/dev/null || true
          # Temporarily skip anime images to test build
          echo "=== Skipping anime images for build test ==="
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc
          echo "=== Images in public/assets ==="
          find public/assets -name "*.webp" | wc -l

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build
        run: |
          cd site
          npm config set registry https://registry.npmjs.org/
          npm install --legacy-peer-deps --no-audit --no-fund 2>&1 | tail -5
          echo "=== npm install done ==="
          npx astro build 2>&1 | tail -40
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit: $BUILD_EXIT"
          echo "dist files: $(find dist -type f 2>/dev/null | wc -l)"
          # Save status
          echo "BUILD_EXIT=$BUILD_EXIT" > ../custom/build-status.txt
          cd ../custom
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build-status.txt
          git commit -m "Build status (no anime images): $BUILD_EXIT" || true
          git push || true
          exit $BUILD_EXIT
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Deploy to gh-pages branch
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          force_orphan: true
